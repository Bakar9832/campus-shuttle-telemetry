apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: campus-shuttle-telemetry-api:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: API_PORT
              value: "3000"
            - name: DATABASE_URL
              value: postgres://telemetry:telemetry@timescale:5432/telemetry
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: NodePort
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080